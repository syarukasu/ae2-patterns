plugins { id 'net.minecraftforge.gradle' }
java { toolchain.languageVersion = JavaLanguageVersion.of(17) }
java.withSourcesJar()
sourceSets {
}
base { archivesName = 'ae2-patterns-forge-1.20.1' }
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            args '--mixin', 'ae2mrp.mixins.json'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', project.file('build/createSrgToMcp/output.srg').absolutePath
            mods { ae2mrp { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run-server')
            args '--nogui'
            mods { ae2mrp { source sourceSets.main } }
        }
    }
}
repositories { maven { url = 'https://modmaven.dev/' } }
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.18'
    implementation fg.deobf('appeng:appliedenergistics2-forge:15.4.10')
    runtimeOnly fg.deobf('org.appliedenergistics:guideme:20.1.7')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    if(project.hasProperty('acoJar')) {
        def fixture=file(project.property('acoJar'))
        if(!fixture.isFile())throw new GradleException('acoJar fixture does not exist')
        repositories { flatDir { dirs fixture.parentFile } }
        runtimeOnly fg.deobf("mrp.fixture:${fixture.name.substring(0,fixture.name.length()-4)}:1")
    }
}
sourceSets.main.java.srcDirs += ['../core/src/main/java', '../shared/src/main/java']
sourceSets.main.resources.srcDir '../shared/src/main/resources'
jar {
    manifest.attributes('MixinConfigs': 'ae2mrp.mixins.json')
    finalizedBy 'reobfJar'
}
