plugins { id 'java-library'; id 'net.neoforged.moddev' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
java.withSourcesJar()
sourceSets {
}
base { archivesName = 'ae2-patterns-neoforge-1.21.1' }
neoForge {
    version = '21.1.247'
    runs {
        client {
            client()
            gameDirectory = file('run')
        }
        server { server(); gameDirectory = file('run-server'); programArgument '--nogui' }
    }
    mods {
        ae2mrp { sourceSet sourceSets.main }
    }
}
neoForge.runs.server.loadedMods.set([neoForge.mods.ae2mrp])
dependencies {
    if(project.hasProperty('neoAcoJar')) {
        def fixture=file(project.property('neoAcoJar'))
        if(!fixture.isFile())throw new GradleException('neoAcoJar fixture does not exist')
        runtimeOnly files(fixture)
    }
    if(project.hasProperty('neoVmJar')) {
        def fixture=file(project.property('neoVmJar'))
        if(!fixture.isFile())throw new GradleException('neoVmJar fixture does not exist')
        runtimeOnly files(fixture)
    }
    implementation('org.appliedenergistics:appliedenergistics2:19.2.17') { transitive = false }
    runtimeOnly('org.appliedenergistics:guideme:21.1.17') { transitive = false }
}
sourceSets.main.java.srcDirs += ['../core/src/main/java', '../shared/src/main/java']
sourceSets.main.resources.srcDir '../shared/src/main/resources'
